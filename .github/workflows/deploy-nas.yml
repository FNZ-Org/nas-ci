# Workflow REUTILIZAVEL de deploy no NAS. Todo projeto do homelab chama este
# arquivo em vez de copiar dezenas de linhas de YAML - corrigir um bug aqui
# conserta o deploy de todos de uma vez.
#
# Uso no repo do projeto (.github/workflows/ci.yml):
#
#   name: Deploy no NAS
#   on:
#     push: { branches: [main] }
#     workflow_dispatch: {}
#   jobs:
#     deploy:
#       uses: FNZ-Org/nas-ci/.github/workflows/deploy-nas.yml@main
#       with:
#         projeto: meuprojeto
#         health-url: http://127.0.0.1:1234/health
#
# POR QUE TUDO RODA NO RUNNER DO NAS
#
# Runner self-hosted nao consome minutos de Actions. A FNZ-Org nao tem cota de
# minutos para repositorio PRIVADO - um job em `ubuntu-latest` num repo privado
# da org morre com startup_failure antes de criar qualquer job. (Verificado: o
# mesmo job roda sem problema no nas-ci, que e publico.)
#
# Consequencia pratica: o NAS builda a imagem, entao o build demora alguns
# minutos em vez de segundos. Em troca, nao depende de cota nem de registry, e o
# repositorio continua privado.
#
# Os TESTES nao tem job proprio de proposito: cada projeto roda os seus dentro
# do build da imagem (um `RUN pytest` no Dockerfile). Se um teste quebra, a
# imagem nao e produzida e o deploy nao acontece - mesma garantia, sem precisar
# de runner do GitHub.

name: Deploy no NAS

on:
  workflow_call:
    inputs:
      projeto:
        description: Nome da stack do compose e do container
        type: string
        required: true
      health-port:
        description: >
          Porta publicada no host a checar depois de subir. Vazio pula a checagem.
          Nao passe URL completa: o healthcheck roda DENTRO do container do
          runner, onde 127.0.0.1 e o proprio runner e nao o NAS.
        type: string
        default: ""
      health-path:
        type: string
        default: "/"
      compose-file:
        type: string
        default: docker-compose.yml

jobs:
  deploy:
    runs-on: [self-hosted, synology]
    permissions:
      contents: read
    steps:
      - name: Checkout + build + subir
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          PROJETO: ${{ inputs.projeto }}
          COMPOSE: ${{ inputs.compose-file }}
        run: |
          set -euo pipefail

          # Checkout manual via git: evita a action actions/checkout, que toma
          # 429 do codeload.github.com no runner do NAS.
          SRC="$RUNNER_TEMP/$PROJETO-$SHA"
          rm -rf "$SRC"
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${REPO}.git" "$SRC"
          cd "$SRC"

          # -p fixa o nome da stack, independente do diretorio do clone (que
          # muda a cada deploy). Sem isso o compose criaria uma stack nova toda
          # vez e deixaria a anterior orfa rodando.
          docker compose -f "$COMPOSE" -p "$PROJETO" up -d --build --remove-orphans
          docker image prune -f

          # O clone e descartavel. Volumes de dados vivem fora dele - se algum
          # projeto apontasse volume para dentro do checkout, perderia tudo aqui.
          cd "$RUNNER_TEMP"
          rm -rf "$SRC"

      - name: Conferir saude
        if: inputs.health-port != ''
        env:
          PORTA: ${{ inputs.health-port }}
          CAMINHO: ${{ inputs.health-path }}
          PROJETO: ${{ inputs.projeto }}
        run: |
          set -u
          # O passo roda dentro do container do runner: 127.0.0.1 aqui e o
          # proprio runner, nao o NAS. O gateway da rota default e o host, que
          # e onde as portas dos servicos estao publicadas.
          HOST=$(ip route | awk '/^default/ {print $3; exit}')
          [ -n "$HOST" ] || HOST=172.17.0.1
          ALVO="http://$HOST:$PORTA$CAMINHO"
          echo "checando $ALVO"
          for i in $(seq 1 24); do
            if curl -fsS -o /dev/null "$ALVO"; then
              echo "no ar apos $((i * 5))s"
              exit 0
            fi
            sleep 5
          done
          echo "nao respondeu em 120s - ultimos logs:"
          docker compose -p "$PROJETO" logs --tail 60
          exit 1
